    );
    const VideoIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="m15 10 4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
    );
    const TagIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>

    const CheckIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>

    );
    const XIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
    );
    const SaveIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    );
    const ExternalLinkIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6m4-3h6v6m-11 5L21 3"/></svg>
    );

    const STYLE_PRESETS = [
      {
        id: "storytime_white_head",
        name: "2D Storytime - Minimalist White Head (iCerita Style)",
        characterLock: "a minimalist cartoon character with a round pure white head, simple dot eyes, wearing a casual hoodie and pants",
        styleSuffix: "2D storytime animation style, clean black outlines, warm pastel color palette, cozy lofi comic aesthetic"
      },
      {
        id: "storytime_npc_interaction",
        name: "2D Storytime - Classic Webtoon (Interaksi Karakter & NPC)",
        characterLock: "a minimalist cartoon character with a round pure white head and dot eyes, interacting with local shopkeeper or characters",
        styleSuffix: "2D storytime animation style, detailed 2D illustrated background, clean line art, warm earthy pastel colors, cozy lofi webcomic aesthetic"
      },
      {
        id: "modern_webtoon_edu",
        name: "Modern Webtoon - Edu-Business (Karakter Manusia + Whiteboard)",
        characterLock: "a young Indonesian male character with black hair and glasses wearing a casual t-shirt, expressive educational style",
        styleSuffix: "Modern 2D webtoon art style, warm lighting, clean line art, educational comic book aesthetic"
      },
      {
        id: "historical_explainer",
        name: "Historical / Science Explainer (Dokumenter & Sejarah Kuno)",
        characterLock: "a simple cartoon character with a round white head and dot eyes pointing at ancient objects or historical timelines",
        styleSuffix: "Minimalist historical educational 2D animation style, sepia tone parchment background, historical documentary aesthetic, clean black line art"
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('narration');
      const [showApiModal, setShowApiModal] = useState(false);
      const [claudeApiKey, setClaudeApiKey] = useState('');
      const [geminiApiKey, setGeminiApiKey] = useState('');
      const [saveKeyStatus, setSaveKeyStatus] = useState(false);
      const [installPrompt, setInstallPrompt] = useState(null);

      const [showQrisModal, setShowQrisModal] = useState(true);
      const [qrisTimer, setQrisTimer] = useState(10);

      useEffect(() => {
        try {
          const savedClaude = localStorage.getItem('faceless_claude_key');
          const savedGemini = localStorage.getItem('faceless_gemini_key');
          if (savedClaude) setClaudeApiKey(savedClaude);
          if (savedGemini) setGeminiApiKey(savedGemini);

          const manifestData = {
            name: "Faceless AI Studio",
            short_name: "FacelessAI",
            start_url: "./index.html",
            display: "standalone",
            background_color: "#0b0f19",
            theme_color: "#0b0f19",
            icons: [
              { src: "https://placehold.co/192x192/7c3aed/ffffff?text=FAI", sizes: "192x192", type: "image/png" },
              { src: "https://placehold.co/512x512/7c3aed/ffffff?text=FAI", sizes: "512x512", type: "image/png" }
            ]
          };
          const blob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
          const manifestEl = document.getElementById('pwa-manifest');
          if (manifestEl) manifestEl.href = URL.createObjectURL(blob);

          if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });`;
            const swBlob = new Blob([swCode], { type: 'text/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
          }

          window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            setInstallPrompt(e);
          });
        } catch (err) {}
      }, []);

      useEffect(() => {
        if (!showQrisModal) return;
        const interval = setInterval(() => {
          setQrisTimer((prev) => {
            if (prev <= 1) {
              clearInterval(interval);
              setShowQrisModal(false);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [showQrisModal]);

      const handleInstallPWA = async () => {
        if (!installPrompt) {
          alert("PWA siap diinstal! Di browser HP Anda (Chrome/Edge), ketuk menu titik tiga di kanan atas lalu pilih 'Tambahkan ke Layar Utama' / 'Install App'.");
          return;
        }
        try {
          installPrompt.prompt();
          const { outcome } = await installPrompt.userChoice;
          if (outcome === 'accepted') setInstallPrompt(null);
        } catch (e) {}
      };

      const handleSaveKeys = () => {
        try {
          localStorage.setItem('faceless_claude_key', claudeApiKey);
          localStorage.setItem('faceless_gemini_key', geminiApiKey);
          setSaveKeyStatus(true);
          setTimeout(() => {
            setSaveKeyStatus(false);
            setShowApiModal(false);
          }, 1200);
        } catch (e) {}
      };

      const [geminiModels] = useState([
        { id: 'gemini-3.5-flash', name: 'Gemini 3.5 Flash (Recommended)' },
        { id: 'gemini-pro', name: 'Gemini Pro 1.5' },
        { id: 'gemini-flash-lite', name: 'Gemini Flash Lite' }
      ]);
      const [selectedGeminiModel, setSelectedGeminiModel] = useState('gemini-3.5-flash');

      const [videoTopic, setVideoTopic] = useState('Kisah Sukses Anak Muda Mengubah Hidup Lewat AI di 2026');
      const [videoDuration, setVideoDuration] = useState(1);
      const [videoAspectRatio, setVideoAspectRatio] = useState('9:16');
      const [selectedStylePreset, setSelectedStylePreset] = useState(STYLE_PRESETS[0].id);

      const [isGeneratingScript, setIsGeneratingScript] = useState(false);
      const [fullNarration, setFullNarration] = useState(
        `Tahukah kamu? Rahasia terbesar di balik jutaan penonton video faceless bukanlah keberuntungan, melainkan teknik hook emosional di 3 detik pertama. Banyak kreator pemula mengira butuh modal besar dan peralatan mahal. Padahal kuncinya ada pada strategi AI automation yang konsisten. Mulai hari ini, terapkan sistem ini dan buktikan sendiri bagaimana kontenmu bekerja otomatis 24 jam non-stop menghasilkan cuan konsisten!`
      );
      const [copyNarrationStatus, setCopyNarrationStatus] = useState(false);

      // SEO Caption & Metadata State
      const [isGeneratingCaption, setIsGeneratingCaption] = useState(false);
      const [reelsCaption, setReelsCaption] = useState("90% pemula rugi di pasar saham karena 1 kesalahan sepele ini! Tonton sampai habis biar gak salah langkah. \n\n#TradingSaham #BelajarTrading #TipsKeuangan #InvestasiPemula #CuanOnline");
      const [ytTitle, setYtTitle] = useState("Rahasia Trading Saham Pemula Anti Rugi 2026 (Strategi Cuan Konsisten)");
      const [ytDesc, setYtDesc] = useState("Pelajari rahasia sukses trader profesional mengatur risiko dan psikologi pasar dalam video edukatif ini. Jangan lupa like dan subscribe untuk tips harian!");
      const [ytTags, setYtTags] = useState("trading saham, belajar trading pemula, tips investasi, rahasia cuan, analisis saham, psikologi trading");
      const [thumbnailPrompt, setThumbnailPrompt] = useState("Cinematic high-contrast professional YouTube thumbnail, dramatic lighting, sharp focus, 8k resolution, aspect ratio 16:9");

      const [copyReelsStatus, setCopyReelsStatus] = useState(false);
      const [copyYtTitleStatus, setCopyYtTitleStatus] = useState(false);
      const [copyYtDescStatus, setCopyYtDescStatus] = useState(false);
      const [copyYtTagsStatus, setCopyYtTagsStatus] = useState(false);
      const [copyThumbStatus, setCopyThumbStatus] = useState(false);

      const handleSafeCopy = (text, setStatusFn) => {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
              setStatusFn(true);
              setTimeout(() => setStatusFn(false), 2000);
            }).catch(() => fallbackCopy(text, setStatusFn));
          } else {
            fallbackCopy(text, setStatusFn);
          }
        } catch (e) {
          fallbackCopy(text, setStatusFn);
        }
      };

      const fallbackCopy = (text, setStatusFn) => {
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.top = "0";
          ta.style.left = "0";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          setStatusFn(true);
          setTimeout(() => setStatusFn(false), 2000);
        } catch (err) {}
      };

      const handleGenerateNarration = async () => {
        setIsGeneratingScript(true);
        try {
          const targetWords = Math.round(videoDuration * 130);
          if (!geminiApiKey) {
            setTimeout(() => {
              setFullNarration(`Tahukah kamu? Rahasia terbesar di balik jutaan penonton video faceless adalah hook emosional di 3 detik pertama... ${videoTopic}. Menggunakan pendekatan visual yang dipilih, audiens akan terpaku dari detik pertama hingga akhir video! Mulai hari ini, terapkan sistem otomasi ini.`);
              setIsGeneratingScript(false);
            }, 800);
            return;
          }

          const systemPrompt = `You are an expert viral scriptwriter skilled in the @narasi-vo method. Output PURE NARRATION TEXT ONLY. Do NOT include markdown headers, no section brackets like [HOOK], no parenthetical directions. Use natural punctuation (periods, commas, ellipses ..., exclamation marks !) for emotional pacing so it is ready for TTS. Target ~${targetWords} words for a ${videoDuration}-minute video.`;
          const userPrompt = `Topik video: "${videoTopic}". Buatkan naskah narasinya saja secara murni dan bersih.`;

          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${selectedGeminiModel}:generateContent?key=${geminiApiKey}`;
          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: userPrompt }] }], systemInstruction: { parts: [{ text: systemPrompt }] } })
          });
          const data = await res.json();
          const txt = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (txt) setFullNarration(txt.trim());
          else setFullNarration("Gagal mendapatkan respons Gemini. Periksa API Key Anda.");
        } catch (err) {
          setFullNarration("Error: " + err.message);
        } finally {
          setIsGeneratingScript(false);
        }
      };

      // Generate SEO Captions & Thumbnail Prompt (Strict JSON Output for clean parsing)
      const handleGenerateSeoAndCaption = async () => {
        setIsGeneratingCaption(true);
        try {
          if (!geminiApiKey) {
            setTimeout(() => {
              setReelsCaption(`Wajib tahu sebelum terlambat! ${videoTopic}. Simpan video ini dan rasakan perubahannya!\n\n#Viral2026 #KontenKreator #FacelessStudio #TipsSukses #Trending`);
              setYtTitle(`Rahasia Terbesar ${videoTopic} (Wajib Tahu!)`);
              setYtDesc(`Pelajari strategi lengkap mengenai ${videoTopic} secara mendalam. Video ini dirancang khusus untuk memberikan insight bernilai tinggi bagi Anda yang ingin berkembang pesat.\n\nTimestamps:\n0:00 Pendahuluan\n1:30 Inti Pembahasan\n3:45 Kesimpulan & Aksi\n\nJangan lupa Like, Comment, & Subscribe!`);
              setYtTags(`kreator indonesia, tips viral, ${videoTopic.toLowerCase()}, edukasi modern, strategi sukses 2026, panduan lengkap`);
              setThumbnailPrompt(`Cinematic high-impact YouTube thumbnail, dramatic studio lighting, ultra-detailed subject representing "${videoTopic}", bold glowing focal point, professional color grading, 8k resolution, 16:9 aspect ratio`);
              setIsGeneratingCaption(false);
            }, 800);
            return;
          }

          const promptText = `Berdasarkan topik video: "${videoTopic}" dan naskah narasi: "${fullNarration.substring(0, 400)}...", hasilkan output HANYA dalam format JSON valid tanpa teks pembuka atau penutup markdown (tanpa backticks json jika memungkinkan, atau format JSON bersih), dengan struktur keys persis berikut:
{
  "reels_caption": "Caption Instagram Reels/TikTok yang memancing interaksi dan rasa penasaran, diakhiri tepat 5 hashtag relevan dan viral.",
  "yt_title": "Judul YouTube SEO yang menarik, ber-CTR tinggi, maksimal 100 karakter.",
  "yt_desc": "Deskripsi YouTube SEO profesional lengkap dengan struktur paragraf, pemanggilan keyword relevan, timestamp placeholder, dan ajakan subscribe (panjang hingga 1000 kata / 5000 karakter).",
  "yt_tags": "Kumpulan tag keyword YouTube dipisah koma yang sangat relevan, total di bawah 500 karakter.",
  "thumbnail_prompt": "Prompt gambar thumbnail YouTube yang sangat detail, profesional, sinematik, dengan subjek yang mencolok dan instruksi pencahayaan studio, siap dipakai untuk ChatGPT atau Google Flow."
}`;

          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${selectedGeminiModel}:generateContent?key=${geminiApiKey}`;
          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: promptText }] }] })
          });
          const data = await res.json();
          let rawTxt = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
          
          // Clean markdown json ticks if present
          rawTxt = rawTxt.replace(/```json/g, '').replace(/```/g, '').trim();
          
          const parsed = JSON.parse(rawTxt);
          if (parsed) {
            if (parsed.reels_caption) setReelsCaption(parsed.reels_caption);
            if (parsed.yt_title) setYtTitle(parsed.yt_title.substring(0, 100));
            if (parsed.yt_desc) setYtDesc(parsed.yt_desc.substring(0, 5000));
            if (parsed.yt_tags) setYtTags(parsed.yt_tags.substring(0, 500));
            if (parsed.thumbnail_prompt) setThumbnailPrompt(parsed.thumbnail_prompt);
          }
        } catch (err) {
          // Fallback regex extraction if JSON parse fails
          alert("Gagal memparsing JSON otomatis, menggunakan format standar.");
        } finally {
          setIsGeneratingCaption(false);
        }
      };

      const totalSeconds = videoDuration * 60;
      const totalAssetsCount = Math.max(4, Math.round(totalSeconds / 4));
      const totalVeoCount = Math.max(1, Math.round(totalSeconds / 8));
      const activeStyleObj = STYLE_PRESETS.find(s => s.id === selectedStylePreset) || STYLE_PRESETS[0];

      const [masterFlowPromptText, setMasterFlowPromptText] = useState('');
      const [masterVeoPromptText, setMasterVeoPromptText] = useState('');
      const [isGeneratingFlowPrompt, setIsGeneratingFlowPrompt] = useState(false);
      const [isGeneratingVeoPrompt, setIsGeneratingVeoPrompt] = useState(false);
      const [copyFlowStatus, setCopyFlowStatus] = useState(false);
      const [copyVeoStatus, setCopyVeoStatus] = useState(false);

      const getSegments = (cnt) => {
        const sents = fullNarration.split(/(?<=[.!?])\s+/).filter(Boolean);
        const res = [];

                      <div className="flex items-center justify-between border-b border-slate-800 pb-2.5">
                        <h4 className="text-sm font-bold text-white">2. Prompt Thumbnail Pro (ChatGPT / Google Flow)</h4>
                        <button onClick={() => handleSafeCopy(thumbnailPrompt, setCopyThumbStatus)} className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl flex items-center gap-1.5">
                          {copyThumbStatus ? <CheckIcon className="w-3.5 h-3.5" /> : <CopyIcon className="w-3.5 h-3.5" />} {copyThumbStatus ? 'Tersalin' : 'Salin Prompt'}
                        </button>
                      </div>
                      <textarea value={thumbnailPrompt} onChange={(e) => setThumbnailPrompt(e.target.value)} rows={5} className="w-full bg-[#0a0e17] border border-slate-700 rounded-xl p-3 text-xs text-slate-200 focus:outline-none" />
                    </div>

                    {/* YouTube Title */}
                    <div className="bg-[#121929] border border-slate-800 p-6 rounded-3xl space-y-3 flex flex-col">
                      <div className="flex items-center justify-between border-b border-slate-800 pb-2.5">
                        <h4 className="text-sm font-bold text-white">3. Judul YouTube SEO (Maks 100 Karakter)</h4>
                        <button onClick={() => handleSafeCopy(ytTitle, setCopyYtTitleStatus)} className="px-3 py-1.5 bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold rounded-xl flex items-center gap-1.5">
                          {copyYtTitleStatus ? <CheckIcon className="w-3.5 h-3.5" /> : <CopyIcon className="w-3.5 h-3.5" />} {copyYtTitleStatus ? 'Tersalin' : 'Salin Judul'}
                        </button>
                      </div>
                      <input type="text" maxLength={100} value={ytTitle} onChange={(e) => setYtTitle(e.target.value)} className="w-full bg-[#0a0e17] border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-slate-200 focus:outline-none" />
                      <span className="text-[10px] text-slate-400 text-right">{ytTitle.length}/100 Karakter</span>
                    </div>

                    {/* YouTube Tags */}
                    <div className="bg-[#121929] border border-slate-800 p-6 rounded-3xl space-y-3 flex flex-col">
                      <div className="flex items-center justify-between border-b border-slate-800 pb-2.5">
                        <h4 className="text-sm font-bold text-white">4. Tag YouTube (Maks 500 Karakter)</h4>
                        <button onClick={() => handleSafeCopy(ytTags, setCopyYtTagsStatus)} className="px-3 py-1.5 bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold rounded-xl flex items-center gap-1.5">
                          {copyYtTagsStatus ? <CheckIcon className="w-3.5 h-3.5" /> : <CopyIcon className="w-3.5 h-3.5" />} {copyYtTagsStatus ? 'Tersalin' : 'Salin Tag'}
                        </button>
                      </div>
                      <input type="text" maxLength={500} value={ytTags} onChange={(e) => setYtTags(e.target.value)} className="w-full bg-[#0a0e17] border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-slate-200 focus:outline-none" />
                      <span className="text-[10px] text-slate-400 text-right">{ytTags.length}/500 Karakter</span>
                    </div>

                    {/* YouTube Description */}
                    <div className="bg-[#121929] border border-slate-800 p-6 rounded-3xl space-y-3 lg:col-span-2 flex flex-col">
                      <div className="flex items-center justify-between border-b border-slate-800 pb-2.5">
                        <h4 className="text-sm font-bold text-white">5. Deskripsi YouTube (Maks 5.000 Karakter)</h4>
                        <button onClick={() => handleSafeCopy(ytDesc, setCopyYtDescStatus)} className="px-3.5 py-1.5 bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold rounded-xl flex items-center gap-1.5">
                          {copyYtDescStatus ? <CheckIcon className="w-3.5 h-3.5" /> : <CopyIcon className="w-3.5 h-3.5" />} {copyYtDescStatus ? 'Tersalin' : 'Salin Deskripsi'}
                        </button>
                      </div>
                      <textarea maxLength={5000} value={ytDesc} onChange={(e) => setYtDesc(e.target.value)} rows={6} className="w-full bg-[#0a0e17] border border-slate-700 rounded-xl p-3 text-xs text-slate-200 focus:outline-none" />
                      <span className="text-[10px] text-slate-400 text-right">{ytDesc.length}/5000 Karakter</span>
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* Footer Watermark & Quick Links */}
          <footer className="w-full py-5 border-t border-slate-800/80 bg-[#0f1523]/80 text-xs text-slate-400 mt-12 flex flex-col items-center justify-center space-y-2">
            <div className="flex flex-wrap items-center justify-center gap-2">
              <span>© 2026 Faceless AI • Bagian dari</span>
              <a href="https://sobatkarya.my.id" target="_blank" rel="noopener noreferrer" className="text-purple-400 font-bold hover:underline">sobatkarya.my.id</a>
              <span>•</span>
              <button onClick={() => setShowQrisModal(true)} className="text-amber-400 font-bold hover:underline flex items-center gap-1">
                <CoffeeIcon className="w-3.5 h-3.5" /> Sawer Seikhlasnya
              </button>
              <span>•</span>
              <a href="https://sobatkarya.my.id" target="_blank" rel="noopener noreferrer" className="text-slate-300 hover:text-white font-semibold flex items-center gap-1">
                <GlobeIcon className="w-3.5 h-3.5" /> Kembali ke Website Utama
              </a>
            </div>
            <div className="text-[11px] text-slate-500">
              Crafted with ❤️ <a href="https://www.instagram.com/tamziz_pb" target="_blank" rel="noopener noreferrer" className="text-purple-400 font-bold hover:underline">by @tamziz_pb</a>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
